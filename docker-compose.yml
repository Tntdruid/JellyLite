# docker compose up -d   ->  http://<server>:8096
# Put config.json in ./data (an example is written there on first start).
services:
  jellylite:
    image: ghcr.io/tntdruid/jellylite-amd64:latest   # Raspberry Pi: jellylite-aarch64
    # build: .
    container_name: jellylite
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data:/data
      - /path/to/media:/media:ro
